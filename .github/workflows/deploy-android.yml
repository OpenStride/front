name: Build & Deploy Android

on:
  # Manual-only, like the iOS deploy: this workflow signs an App Bundle and
  # pushes it to the Play Store, and `release.yml` tags every merge to
  # main. Left on `push: tags: ['v*']` it would try to publish a release of the
  # native app each time the PWA's version is bumped — with store credentials
  # that are not set up yet. Re-add the tag trigger once ANDROID_KEYSTORE and
  # GOOGLE_PLAY_SERVICE_ACCOUNT exist and a track is chosen.
  workflow_dispatch:

concurrency:
  group: deploy-android
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      # Same toolchain as build-android-test.yml, which is the build known to
      # produce an app that works: Capacitor 8 needs Node >= 22 and JDK 21.
      - name: Setup Node.js
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod
        env:
          VITE_APP_BASE_URL: https://openstride.org
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.VITE_GOOGLE_DRIVE_API_KEY }}

      # The plugins, minSdk and permissions of the test build. This workflow used
      # to install Capacitor alone, so a signed release would have shipped
      # without Health Connect or background GPS.
      - name: Add Capacitor Android + health plugin
        run: |
          npm install @capacitor/cli@^8 @capacitor/android@^8 capacitor-health @capacitor-community/background-geolocation
          cp ci/capacitor.config.json capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Bump minSdk to 26 (Health Connect requirement)
        run: sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle

      - name: Declare Health Connect + location permissions in the manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.health.READ_EXERCISE" />\n    <uses-permission android:name="android.permission.health.READ_HEART_RATE" />\n    <uses-permission android:name="android.permission.health.READ_EXERCISE_ROUTE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|' "$MANIFEST"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > android/app/keystore.jks

      - name: Build Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: app.openstride
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
