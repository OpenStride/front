name: CI

# One workflow for every change, and the only road to production.
#
# A pull request runs the checks, the end-to-end suite and a build, then
# publishes that build to a preview channel. A push to main runs the same three
# and, only when all of them are green, hands over to `release.yml`. The deploy
# used to start on the push itself, in parallel with the checks, so a red main
# shipped anyway.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes the running checks moot. On main every
  # run ends in a release, so none is interrupted halfway through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The Cypress binary is the e2e job's business; downloading it here was
      # half of this job's install time.
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: npm run format:check
      - run: npm run lint
      # vue-tsc, not tsc: plain tsc cannot parse a single-file component, so it
      # silently skipped every .vue in the repo.
      - run: npm run typecheck
      # The coverage thresholds live in vitest.config.ts and fail the run.
      - run: npx vitest run --coverage
      # Production dependencies only: devDependencies never reach a browser.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The Cypress binary is ~220 MB. actions/cache treats a failed save as a
      # warning; the Cypress action's own cache treats it as fatal, and a GitHub
      # cache hiccup on a cold key failed this job before the dev server started.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # npm ci also downloads the Cypress binary when the cache missed.
      - run: npm ci

      - uses: cypress-io/github-action@v7.0.0
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome

      - uses: actions/upload-artifact@v6.0.0
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-node@v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0

      - run: npm run build:prod
        env:
          VITE_APP_BASE_URL: https://openstride.org
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_DRIVE_API_KEY: ${{ secrets.VITE_GOOGLE_DRIVE_API_KEY }}
          VITE_GARMIN_CLIENT_ID: ${{ secrets.VITE_GARMIN_CLIENT_ID }}

      # What Lighthouse was meant to catch, measured where it can still stop a
      # merge: a PWA that quietly doubles its JavaScript is slower to install
      # and to update on every phone. 1.74 MiB when the budget was set.
      - name: Bundle size budget
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          BUDGET_KIB=2000
          JS_KIB=$(find dist -name '*.js' -printf '%s\n' | awk '{s+=$1} END {printf "%d", s/1024}')
          echo "JavaScript: ${JS_KIB} KiB (budget ${BUDGET_KIB} KiB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$JS_KIB" -gt "$BUDGET_KIB" ]; then
            echo "::error::JavaScript bundle is ${JS_KIB} KiB, over the ${BUDGET_KIB} KiB budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7

  preview:
    name: Preview channel
    needs: build
    # Secrets are not handed to forks or to Dependabot, and the deploy needs them.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # firebase.json, which says what to publish.
      - uses: actions/checkout@v6.0.1

      # The very build the checks ran against, not a second one.
      - uses: actions/download-artifact@v6.0.0
        with:
          name: dist
          path: dist/

      # The action comments the preview URL on the pull request and updates that
      # one comment on later pushes. The channel expires by itself after 7 days.
      - uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENSTRIDE }}
          projectId: openstrive-edd63
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d

  release:
    name: Release
    needs: [checks, e2e, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      checks: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    secrets: inherit
