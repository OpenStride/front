<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.ico" />
    <title>OpenStride</title>
    <!-- Même valeur que --surface-app / background_color du manifeste : évite
         le flash blanc entre le splash screen et le premier rendu, avant que
         la feuille de styles n'ait été appliquée au <body>. -->
    <style>
      html {
        background-color: #ececea;
      }
    </style>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but OpenStride doesn't work properly without JavaScript enabled. Please enable
        it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
